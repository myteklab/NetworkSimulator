<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>

  <!-- Connection lines -->
  <line x1="64" y1="52" x2="32" y2="28" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="64" y1="52" x2="96" y2="28" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="64" y1="52" x2="28" y2="76" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="64" y1="52" x2="100" y2="76" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="28" y1="76" x2="42" y2="104" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="28" y1="76" x2="64" y2="100" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>
  <line x1="100" y1="76" x2="86" y2="104" stroke="#3498db" stroke-width="2.5" opacity="0.6"/>

  <!-- Central router node -->
  <circle cx="64" cy="52" r="14" fill="#16213e" stroke="#3498db" stroke-width="2.5"/>
  <circle cx="64" cy="52" r="7" fill="#3498db"/>

  <!-- Top-left node (computer) -->
  <circle cx="32" cy="28" r="10" fill="#16213e" stroke="#2ecc71" stroke-width="2"/>
  <rect x="27" y="24" width="10" height="7" rx="1.5" fill="#2ecc71"/>

  <!-- Top-right node (computer) -->
  <circle cx="96" cy="28" r="10" fill="#16213e" stroke="#2ecc71" stroke-width="2"/>
  <rect x="91" y="24" width="10" height="7" rx="1.5" fill="#2ecc71"/>

  <!-- Left switch node -->
  <circle cx="28" cy="76" r="11" fill="#16213e" stroke="#f39c12" stroke-width="2"/>
  <rect x="21" y="73" width="14" height="6" rx="2" fill="#f39c12"/>

  <!-- Right switch node -->
  <circle cx="100" cy="76" r="11" fill="#16213e" stroke="#f39c12" stroke-width="2"/>
  <rect x="93" y="73" width="14" height="6" rx="2" fill="#f39c12"/>

  <!-- Bottom-left endpoint -->
  <circle cx="42" cy="104" r="8" fill="#16213e" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="42" cy="104" r="3.5" fill="#e74c3c"/>

  <!-- Bottom-center endpoint -->
  <circle cx="64" cy="100" r="8" fill="#16213e" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="64" cy="100" r="3.5" fill="#e74c3c"/>

  <!-- Bottom-right endpoint -->
  <circle cx="86" cy="104" r="8" fill="#16213e" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="86" cy="104" r="3.5" fill="#e74c3c"/>
</svg>
